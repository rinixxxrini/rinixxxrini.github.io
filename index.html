<style>

:root{
  --paper:#ecebe8; --sheet:#fbfaf8; --ink:#1c1a1a; --muted:#77716d; --line:#dcd8d3;
  --wine:#a5232c; --wine-soft:#f5e3e3; --chip:#f1efec;
  --serif:"Nanum Myeongjo","Batang",Georgia,serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#191717; --sheet:#232020; --ink:#f0ece8; --muted:#a39b96; --line:#3a3533;
    --wine:#e0525b; --wine-soft:#3d2224; --chip:#2e2a29;
  }
}
:root[data-theme="dark"]{
  --paper:#191717; --sheet:#232020; --ink:#f0ece8; --muted:#a39b96; --line:#3a3533;
  --wine:#e0525b; --wine-soft:#3d2224; --chip:#2e2a29;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:28px 16px 250px}
header{text-align:center;margin-bottom:20px}
header h1{font-family:var(--serif);font-weight:800;font-size:clamp(26px,7vw,36px);letter-spacing:.01em;margin:0;line-height:1.15}
header p{margin:6px 0 0;color:var(--muted);font-size:14px}
.rule{display:flex;align-items:center;gap:10px;justify-content:center;margin:14px auto 0;color:var(--wine)}
.rule::before,.rule::after{content:"";height:1px;width:56px;background:currentColor;opacity:.5}
.rule span{width:7px;height:7px;transform:rotate(45deg);background:currentColor}

.cartbox{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--paper);padding:8px 0 10px;margin:0 0 10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font:inherit;font-size:13.5px;font-weight:500;padding:7px 12px;border-radius:3px;cursor:pointer;max-width:170px}
.tabs button .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button .tc{font-size:11.5px;background:var(--chip);color:var(--muted);padding:0 6px;border-radius:999px;min-width:20px;text-align:center}
.tabs button[aria-pressed="true"]{background:var(--wine);border-color:var(--wine);color:#fff}
.tabs button[aria-pressed="true"] .tc{background:rgba(255,255,255,.25);color:#fff}
.tabs button.add{color:var(--muted);border-style:dashed}
.cartedit{display:flex;gap:8px;margin-top:8px;align-items:center}
.cartedit input{flex:1;min-width:0;font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:3px}
.cartedit button{flex:none;font:inherit;font-size:12.5px;padding:7px 10px;border:1px solid var(--line);background:var(--sheet);color:var(--muted);border-radius:3px;cursor:pointer}
.cartedit button.warn{background:var(--wine);color:#fff;border-color:var(--wine)}
.cartedit button:disabled{opacity:.4;cursor:default}
.hint{font-size:12px;color:var(--muted);margin-top:6px}

.views{display:flex;gap:0;margin:0 0 12px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--sheet)}
.views button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:14.5px;font-weight:600;padding:11px 8px;cursor:pointer}
.views button+button{border-left:1px solid var(--line)}
.views button .vc{font-size:11.5px;background:var(--chip);color:var(--muted);padding:0 7px;border-radius:999px;min-width:20px}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.views button[aria-pressed="true"] .vc{background:rgba(255,255,255,.22);color:inherit}
.views button:focus-visible{outline:2px solid var(--wine);outline-offset:-2px}
.filter{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto}
.filter button{flex:none;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer}
.filter button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}

.list{background:var(--sheet);border:1px solid var(--line);border-radius:4px}
.item{padding:16px;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.rsv{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.rsv input{width:17px;height:17px;margin:0;accent-color:var(--wine);cursor:pointer}
.rsv.on{color:var(--wine)}
.rtag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--wine);border:1px solid var(--wine);border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:1px}
.tabs button .pb{font-size:10.5px;font-weight:600;padding:0 5px;border-radius:3px;border:1px solid currentColor;opacity:.85}
.evpick{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:600;color:var(--wine);border:1px solid var(--wine);border-radius:3px;padding:1px 6px}
.item.on{background:linear-gradient(90deg,var(--wine-soft),transparent 60%)}
.head{display:flex;gap:10px;align-items:flex-start}
.no{flex:none;background:var(--ink);color:var(--sheet);font-size:12px;font-weight:600;width:26px;height:22px;display:grid;place-items:center;margin-top:1px}
.title{flex:1;min-width:0}
.name{font-weight:600;font-size:15.5px;line-height:1.35}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.price{margin-top:3px;font-weight:600}
.price s{color:var(--muted);font-weight:400;margin-right:6px}
.limit{flex:none;background:var(--wine);color:#fff;font-size:11.5px;font-weight:500;padding:3px 7px;white-space:nowrap;margin-top:1px}
.note{font-size:12px;color:var(--wine);margin-top:4px}
.pic{margin:12px 0 0 36px;background:#fff;border:1px solid var(--line);border-radius:3px;padding:6px;display:flex;justify-content:center}
.pic img{display:block;max-width:100%;max-height:150px;height:auto;width:auto;object-fit:contain}
.vars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px;padding-left:36px}
.var{background:var(--chip);padding:6px 6px 6px 10px;border-radius:3px}
.var .row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.var .vl{font-size:13px;font-weight:600;color:var(--muted)}
.var.has .vl{color:var(--ink)}
.var .meta{font-size:11.5px;color:var(--muted);margin-top:3px;min-height:16px}
.var .meta b{color:var(--ink);font-weight:600}
.var.max .meta,.var.max .meta b{color:var(--wine)}
.step{display:flex;align-items:center}
.step button{width:32px;height:32px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font-size:18px;line-height:1;cursor:pointer;border-radius:3px;display:grid;place-items:center;padding:0}
.step button:disabled{opacity:.3;cursor:default}
.step button:focus-visible,.filter button:focus-visible,.bar button:focus-visible,.tabs button:focus-visible,.cartedit button:focus-visible,.cartedit input:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.step .qin{width:46px;height:32px;margin:0 2px;text-align:center;font-family:inherit;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;border:1px solid transparent;background:transparent;color:inherit;border-radius:3px;padding:0;-moz-appearance:textfield}
.step .qin:hover{border-color:var(--line)}
.step .qin:focus{border-color:var(--wine);background:var(--sheet);outline:none}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--sheet);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.bar-in{max-width:640px;margin:0 auto}
.cur{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;opacity:.85;margin-bottom:2px}
.cur b{font-weight:600}
.curlist{display:grid;gap:3px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2)}
.currow{display:flex;justify-content:space-between;gap:10px;font-size:13px;opacity:.72}
.currow span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.currow b{font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.currow.act{opacity:1}
.currow.act span::before{content:"\25CF  ";color:#ff8a92}
.sum{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sum .cnt{font-size:13px;opacity:.75;min-width:0;line-height:1.35}
.sum .cnt .cl{display:block;white-space:nowrap}
.sum .tot{font-family:var(--serif);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
@media (max-width:360px){.sum .tot{font-size:22px}}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{flex:1;font:inherit;font-size:14px;padding:9px 6px;border-radius:3px;cursor:pointer;border:1px solid rgba(255,255,255,.3);background:transparent;color:inherit}
.acts button.pri{background:var(--wine);border-color:var(--wine);color:#fff}
.acts button.warn{background:#fff;color:#a5232c;border-color:#fff}
.receipt{max-height:0;overflow:hidden;transition:max-height .25s ease}
.receipt.open{max-height:42vh;overflow-y:auto;margin-bottom:10px}
.receipt table{width:100%;border-collapse:collapse;font-size:13px}
.receipt td{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.15);vertical-align:top}
.receipt td:nth-child(2){text-align:center;width:44px;opacity:.8}
.receipt td:last-child{text-align:right;width:92px;font-variant-numeric:tabular-nums}
.receipt tr.ch td{padding-top:10px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.4);color:#ffd9dc}
.receipt .empty{opacity:.7;font-size:13px;padding:6px 0}
.toast{position:fixed;left:50%;bottom:190px;transform:translateX(-50%);background:var(--wine);color:#fff;padding:8px 14px;border-radius:3px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:6;max-width:90%;text-align:center}
.toast.show{opacity:1}
.toast.info{background:#2b2826;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25)}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:18px}
.gift{background:var(--sheet);border:1px solid var(--line);border-radius:4px;margin:0 0 12px;padding:14px 16px}
.gift h2{font-family:var(--serif);font-size:18px;font-weight:800;margin:0}
.gift .gs{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.grow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.gimg{flex:none;width:58px;height:58px;background:#fff;border:1px solid var(--line);border-radius:3px;display:grid;place-items:center;overflow:hidden;padding:3px}
.gimg img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.gmain{flex:1;min-width:0}
.gname{display:block;font-weight:600;font-size:14px}
.gcond{display:block;font-size:12px;color:var(--muted)}
.gnext{display:block;font-size:12px;color:var(--wine);margin-top:1px}
.gcnt{flex:none;font-family:var(--serif);font-weight:800;font-size:24px;min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
.gcnt.zero{color:var(--muted);opacity:.45}
.gnote{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.55}
.gnote.warn{color:var(--wine);font-weight:500}
.gnote summary{cursor:pointer}
.gnote ul{margin:6px 0 0;padding-left:18px}
.chk{cursor:pointer}
.chk input{flex:none;width:22px;height:22px;accent-color:var(--wine);margin:0}
.tags{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.limit.ex{background:var(--muted)}
.receipt tr.gr td{font-size:12px;color:#ffd9dc;opacity:.9;padding-top:2px;border-bottom:none}
.tabrow{display:flex;gap:8px;align-items:flex-start}
.tabrow .tabs{flex:1;min-width:0}
.ldtab{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--ink);background:var(--sheet);color:var(--ink);font:inherit;font-size:13.5px;font-weight:600;padding:7px 12px;border-radius:3px;cursor:pointer}
.ldtab .tc{font-size:11.5px;background:var(--chip);color:var(--muted);padding:0 6px;border-radius:999px;min-width:20px;text-align:center}
.ldtab[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.ldtab[aria-pressed="true"] .tc{background:rgba(255,255,255,.22);color:inherit}
.ldtab:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.receipt,.toast{transition:none}}
@media (max-width:380px){.vars,.pic{padding-left:0;margin-left:0}}

/* ---- site layer ---- */
[hidden]{display:none !important}
/* home (white, simple) */
:root{--homebg:#fff;--hline:#e7e7e7;--hmuted:#8d8d8d;--htop:#f5f5f5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--homebg:#151414;--hline:#34302e;--hmuted:#9b9490;--htop:#1d1b1b}}
:root[data-theme="dark"]{--homebg:#151414;--hline:#34302e;--hmuted:#9b9490;--htop:#1d1b1b}
body.home{background:linear-gradient(var(--htop) 0,var(--homebg) 170px) no-repeat,var(--homebg)}
.hometop{border-bottom:1px solid var(--hline);background:var(--homebg)}
.hometop-in{max-width:640px;margin:0 auto;padding:13px 16px;display:flex;align-items:center;gap:9px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15.5px;letter-spacing:-.01em}
.brand i{display:block;width:24px;height:24px;border-radius:7px;background:var(--wine);position:relative}
.brand i{display:grid;place-items:center}.brand i svg{width:15px;height:15px;display:block}
.wrap.home{padding:22px 16px 48px}
.homehead h1{font-family:var(--sans);font-weight:700;font-size:21px;letter-spacing:.01em;margin:0;line-height:1.3;word-break:keep-all}
.homehead p{margin:3px 0 0;color:var(--hmuted);font-size:13.5px}
.hometabs{margin-top:16px;flex-wrap:wrap}.hometabs b{font-weight:600;margin-left:2px;opacity:.7}.homeempty{grid-column:1/-1;color:var(--muted);padding:32px 0;text-align:center}
.homesearch{position:relative;margin-top:14px;display:flex;align-items:center}
.homesearch svg{position:absolute;left:12px;width:17px;height:17px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;pointer-events:none}
.homesearch input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 38px 10px 38px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;-webkit-appearance:none;appearance:none}
.homesearch input::-webkit-search-cancel-button{display:none}
.homesearch input:focus{outline:none;border-color:var(--wine)}
.homesearch button{position:absolute;right:8px;width:26px;height:26px;border:0;border-radius:50%;background:var(--chip);color:var(--muted);font-size:16px;line-height:1;cursor:pointer}
.evgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
@media (min-width:560px){.evgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.evcard{display:block;text-align:left;width:100%;background:var(--homebg);border:1px solid var(--hline);border-radius:10px;overflow:hidden;cursor:pointer;color:inherit;font:inherit;padding:0}
.evcard:hover{border-color:var(--hmuted)}
.evcard:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.evcover{display:block;position:relative;width:100%;height:0;padding-bottom:125%;background:#f1f1f1;overflow:hidden}
.evcard{display:block;height:100%;cursor:pointer;text-align:left;box-sizing:border-box}
.evinfo{display:block}
.evwork{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.evname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evdate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evmeta{margin-top:0 !important;padding-top:10px;flex-wrap:wrap;row-gap:2px}
.evsums{margin-top:4px;min-height:calc(2 * 1.4 * 13px)}
.evsum{font-size:13px;color:var(--hmuted);line-height:1.4;word-break:keep-all}
.evsum b{font-weight:600}
.evsum.on{color:var(--ink)}
.evsum.on b{color:var(--wine);font-weight:700}
.pic{display:block;text-align:center}
.pic img{display:inline-block;max-width:100%;max-height:150px;width:auto;height:auto;vertical-align:top}
.gimg{display:flex;align-items:center;justify-content:center}
.giftline{font-size:12.5px;color:#ffd9dc;margin:-2px 0 8px;line-height:1.5}
.giftline b{font-weight:600;color:#fff}
.evcard.ended{opacity:.78}
.evcard.ended .evcover img{filter:grayscale(1) brightness(.92)}
.evcard.ended .evwork,.evcard.ended .evname,.evcard.ended .evdate,.evcard.ended .evmeta{color:var(--hmuted)}
.evcard.ended .evmeta b{color:var(--hmuted)}
.endmask{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(30,30,30,.42);display:flex;align-items:center;justify-content:center}
.endmask span{color:#fff;font-weight:800;font-size:24px;letter-spacing:.2em;padding:3px 4px 3px 16px;border:3px solid #fff;border-radius:3px;transform:rotate(-9deg)}
.endpill{display:inline-block;vertical-align:middle;margin-left:10px;font-family:var(--sans);font-size:12px;font-weight:800;letter-spacing:.14em;padding:2px 8px 2px 10px;background:var(--ink);color:var(--sheet);border-radius:3px}
.evcover img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%;display:block}
.evinfo{padding:11px 12px 13px}
.evwork{font-weight:700;font-size:15px;line-height:1.3;letter-spacing:-.01em}
.evname{font-weight:600;font-size:12.5px;line-height:1.35;margin-top:3px;color:var(--ink);opacity:.72}
.evdate{color:var(--hmuted);font-size:12px;margin-top:4px}
.evmeta{display:flex;gap:9px;margin-top:8px;font-size:12px;color:var(--hmuted)}
.evmeta b{color:var(--wine);font-weight:600}
.homefoot{color:var(--hmuted);font-size:12px;text-align:center;margin-top:26px;line-height:1.6}
.bkrow{display:flex;justify-content:center;gap:8px;margin-top:10px}
.bkrow button{font:inherit;font-size:12.5px;padding:7px 12px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;cursor:pointer}
.bktext{width:100%;min-height:120px;font:12px/1.4 ui-monospace,Menlo,monospace;padding:8px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);word-break:break-all;resize:vertical;box-sizing:border-box}
.evbar{display:flex;align-items:center;gap:8px;margin:-8px 0 14px}

function giftCount(r, elig, byNo){
  const t = r.rule;
  if(t.type==="min") return elig>=t.amount ? 1 : 0;
  if(t.type==="per") return Math.min(t.cap||Infinity, Math.floor(elig/t.amount));
  if(t.type==="item") return byNo[t.no]||0;
  if(t.type==="items") return Math.floor(t.nos.reduce((a,n)=>a+(byNo[n]||0),0)/(t.div||1)) * (t.mult||1);
  if(t.type==="pairs") return Math.min(t.a.reduce((x,n)=>x+(byNo[n]||0),0), t.b.reduce((x,n)=>x+(byNo[n]||0),0));
  if(t.type==="parts") return t.parts.reduce((a,pt)=>a+Math.floor(pt.nos.reduce((x,n)=>x+(byNo[n]||0),0)/(pt.div||1))*(pt.mult||1),0);
  return 0;
}
function benefits(c){
  let pay=0, elig=0; const byNo = {};
  ITEMS.forEach(it=>(it.vars||[null]).forEach(v=>{
    const q = c.qty[key(it,v)]||0; if(!q) return;
    pay += q*it.price;
    if(!it.noBenefit && !it.noElig) elig += q*it.price;
    byNo[it.no] = (byNo[it.no]||0) + q;
  }));
  const g = {}; EV.gifts.forEach(r=>{ g[r.id] = giftCount(r,elig,byNo); });
  return {pay,elig,g,byNo};
}

  const bs = state.carts.map(benefits);
  const elig = bs.reduce((a,b)=>a+b.elig,0), pay = bs.reduce((a,b)=>a+b.pay,0);
  const byNo = {}; bs.forEach(b=>Object.keys(b.byNo).forEach(k=>{ byNo[k] = (byNo[k]||0) + b.byNo[k]; }));
  const g = {}; EV.gifts.forEach(r=>{ g[r.id] = giftCount(r,elig,byNo); });

}
function allGifts(){
  if(EV.combineCarts){ const a = allBenefits(); return {elig:a.elig,g:a.g}; }

}

    const b = benefits(state.cafe);
    chips = cafeGifts().map(r=>({r,n:b.g[r.id],next:""}));
  } else chips = giftRows().map(x=>({r:x.r,n:x.n,next:x.short||""}));
  const key0 = String(act);
  // 넓은 화면은 한 줄 최대 3개(3→3 · 4→2·2 · 5→2·3), 모바일은 최대 2개 · 남는 칸은 아래 줄로
  const spans = max => { const n = chips.length, rows = Math.ceil(n/max) || 1, base = Math.floor(n/rows), extra = n % rows, out = [];
    for(let r=0;r<rows;r++){ const k = r<rows-extra ? base : base+1; for(let j=0;j<k;j++) out.push(6/k); } return out; };
  const s3 = spans(3), s2 = spans(2);
  el.innerHTML = chips.map((x,i)=>{
    const bump = gmPrev[key0+x.r.id]!==undefined && gmPrev[key0+x.r.id]!==x.n;
    return `<span class="gm${x.n?" on":""}${bump?" bump":""}" style="--s3:${s3[i]};--s2:${s2[i]}"><img loading="lazy" src="${EV.gimg[x.r.img]}" alt=""><span class="gt"><span class="gn">${esc(x.r.short)}</span><b>${x.n}</b></span>${x.next?`<small>${esc(x.next)}</small>`:""}</span>`;
  }).join("");
  chips.forEach(x=>{ gmPrev[key0+x.r.id] = x.n; });
}
const shortWon = n => n>=10000 && n%1000===0 ? `${n/10000}만 원` : won(n);
function giftRows(){
  const c = cart(), b = EV.combineCarts ? allBenefits() : benefits(c), ab = allBenefits();
  return mdGifts().map(r=>{
    const src = (r.combine && !EV.combineCarts) ? ab : b;
    const n = src.g[r.id], t = r.rule; let next = "", pct = null, short = "";
    if(t.type==="min"){ pct = Math.min(100, src.elig/t.amount*100); if(!n){ next = `${won(t.amount-src.elig)} 더 담으면 받아요`; short = `+${shortWon(t.amount-src.elig)}`; } }
    else if(t.type==="per"){
      if(t.cap && n>=t.cap){ pct = 100; next = `최대 ${t.cap}${r.unit||"개"}까지 받았어요`; short = "최대"; }
      else { const m = src.elig % t.amount; pct = m/t.amount*100; next = `다음 1${r.unit||"개"}까지 ${won(t.amount-m)}`; short = `+1까지 ${shortWon(t.amount-m)}`; }
    }
    return {r,n,next,pct,short};
  });
}

async function copyText(text, okMsg){

  catch(e){
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast(okMsg); } catch(_){ toast("복사가 안 돼요. 해시태그를 길게 눌러 복사해 주세요"); }

const dayLabel = d => { const [y,m,dd] = d.split("-").map(Number); return `${m}/${dd} (${"일월화수목금토"[new Date(y,m-1,dd).getDay()]})`; };
function buildCollect(cf){
  const co = state.coll, have = co.have;
  const got = Array.from({length:cf.n},(_,i)=>i+1).filter(i=>have[i]>0).length;
  const dup = Object.values(have).reduce((a,q)=>a+Math.max(0,q-1),0);
  const box = document.createElement("div");

  const days = Object.keys(co.log).filter(d=>co.log[d].length).sort().reverse();
  box.innerHTML = `<div class="ch2"><b>${esc(cf.title||"포토카드 도감")}</b><span><em>${got}</em>/${cf.n} 모음${dup?` · 중복 ${dup}장`:""}</span></div>
    <span class="gbar"><i style="width:${(got/cf.n*100).toFixed(1)}%"></i></span>
    <p class="ctip">받은 카드 번호를 누르면 오늘 기록에 1장 더해져요. 잘못 눌렀으면 −로 빼세요.</p>
    <div class="cgrid">${Array.from({length:cf.n},(_,i)=>{ const k=i+1, q=have[k]||0;
      return `<div class="cslot${q?" has":""}"><button type="button" class="cadd" data-k="${k}" aria-label="${k}번 카드 1장 추가">${k}<small>${q?(q>1?`×${q}`:"보유"):"미보유"}</small></button>${q?`<button type="button" class="csub" data-k="${k}" aria-label="${k}번 카드 1장 빼기">−</button>`:""}</div>`; }).join("")}</div>
    ${days.length ? `<div class="clog"><b>받은 기록</b>${days.map(d=>`<div><span>${dayLabel(d)}${d===todayStr()?" · 오늘":""}</span><span>${co.log[d].slice().sort((a,b)=>a-b).map(k=>`${k}번`).join(", ")}</span></div>`).join("")}</div>` : ""}`;
  box.querySelectorAll(".cadd").forEach(b=>b.onclick = ()=>{
    const k = +b.dataset.k, t = todayStr();
    have[k] = (have[k]||0) + 1;
    (co.log[t] = co.log[t] || []).push(k);
    save(); renderComplete(); renderLdTab();
    toast(have[k]>1 ? `${k}번 · 중복 ${have[k]-1}장째예요` : `${k}번 카드를 모았어요`);
  });
  box.querySelectorAll(".csub").forEach(b=>b.onclick = ()=>{
    const k = +b.dataset.k;
    if(!have[k]) return;
    have[k]--; if(!have[k]) delete have[k];
    const d = Object.keys(co.log).sort().reverse().find(x=>co.log[x].includes(k));
    if(d){ const a = co.log[d]; a.splice(a.lastIndexOf(k),1); if(!a.length) delete co.log[d]; }
    save(); renderComplete();
  });
  return box;
}

function setQty(it,v,raw,anchor){
  const c = cart(), k = key(it,v), q = c.qty[k]||0;
  const digits = String(raw).replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0)).replace(/[^0-9]/g,"");
  if(digits===""){ refresh(anchor); return; }
  let n = parseInt(digits.slice(0,4),10);
  const cap = q + Math.max(0, maxFor(it) - usedAll(it,v));
  if(n>cap){
    n = cap;
    toast(it.limit ? `${it.name}${v?` [${v}]`:""}: ${limitLabel(it)}까지라 ${n}개로 맞췄어요 (모든 장바구니 합산)` : `한 번에 최대 ${SOFT_MAX}개까지 담을 수 있어요`);
  }
  if(n===0) delete c.qty[k]; else c.qty[k] = n;
  save(); refresh(anchor);
}
function change(it,v,d,anchor){
  const c = cart(), k = key(it,v);
  const q = c.qty[k]||0;
  if(d>0 && usedAll(it,v) >= maxFor(it)){ toast(it.limit ? `${it.name}${v?` [${v}]`:""}: ${limitLabel(it)}까지라 더 담을 수 없어요 (모든 장바구니 합산)` : `한 번에 최대 ${SOFT_MAX}개까지 담을 수 있어요`); return; }
  const next = Math.max(0, q+d);
  if(next===0) delete c.qty[k]; else c.qty[k] = next;
  if(d>0 && it.limit && usedAll(it,v)>=it.limit) toast(`${it.name}${v?` [${v}]`:""}: 최대 수량(${it.limit}${it.unit||"개"})까지 담았어요`, "info");
  save(); refresh(anchor);
}
// 수량만 바뀔 때는 목록을 새로 그리지 않고 수량 칸만 바꿔요. (전체를 다시 그리면 이미지가 다시 로드되면서 화면이 밀려요)
// 위쪽 특전 영역 높이가 바뀌어도 누른 굿즈가 화면에서 같은 자리에 있도록 스크롤을 보정해요.
function refresh(anchor){
  if(filter==="picked" && !specialActive(state.active)){ render(); return; }
  const top = anchor && anchor.isConnected ? anchor.getBoundingClientRect().top : null;
  const cur = cart();
  renderTabs();
  $("list").querySelectorAll(".item[data-no]").forEach(el=>{
    const it = ITEMS.find(i=>String(i.no)===el.dataset.no); if(!it) return;

  });
  $("list").querySelectorAll(".menucard").forEach(el=>{
    const menu = ITEMS.filter(it=>isCafeItem(it) && (!el.dataset.menu || it.cat===el.dataset.menu)).sort((x,y)=>x.no-y.no);
    el.classList.toggle("on", menu.some(it=>itemInCart(it,cur)));
    const n = menu.reduce((a,it)=>a+(it.vars||[null]).reduce((s,v)=>s+(cur.qty[key(it,v)]||0),0),0);
    const hd = el.querySelector(".mchead span"); if(hd) hd.textContent = `${menu.length}종${n?` · ${n}개 담음`:""}`;
    const g = el.querySelector(".mvars");

}

function groupByCat(lines){
  const order = [...EV.cats, EV.ldCat || "럭키드로우"];
  return order.map(cat=>{
    const ls = lines.filter(l=>l.cat===cat);
    return ls.length ? {cat, lines:ls, q:ls.reduce((a,l)=>a+l.q,0), sum:ls.reduce((a,l)=>a+l.sum,0)} : null;
  }).filter(Boolean);
}
function sidePools(){ const a = [{c:state.ld,kind:"ld"}]; if(hasCafe(EV)) a.push({c:state.cafe,kind:"cafe"}); return a; }
const cafeGiftText = () => giftText(benefits(state.cafe).g, cafeGifts());
const poolTotals = () => allPools(state).reduce((a,c)=>{const t=cartTotals(c);return {q:a.q+t.q,sum:a.sum+t.sum};},{q:0,sum:0});

/* ======================= 확대 방지 · 이미지 크게 보기 ======================= */
const zoomv = $("zoomv"), zstage = $("zstage"), zimg = $("zimg");
let zs = 1, ztx = 0, zty = 0, zStart = null, zLastTap = 0, zMoved = false;
const zPts = new Map();
const zApply = () => { zimg.style.transform = `translate(${ztx}px,${zty}px) scale(${zs})`; };
function zClamp(){
  if(zs <= 1.001){ zs = 1; ztx = 0; zty = 0; return; }
  const r = zstage.getBoundingClientRect();
  const mx = Math.max(0, (zimg.offsetWidth*zs - r.width)/2 + 12), my = Math.max(0, (zimg.offsetHeight*zs - r.height)/2 + 12);
  ztx = Math.min(mx, Math.max(-mx, ztx)); zty = Math.min(my, Math.max(-my, zty));
}
function zCenter(){ const r = zstage.getBoundingClientRect(); return {x:r.left + r.width/2, y:r.top + r.height/2}; }
function zZoomAt(ns, m, base){
  const c = zCenter(), b = base || {s:zs, tx:ztx, ty:zty, m};
  const qx = (b.m.x - c.x - b.tx)/b.s, qy = (b.m.y - c.y - b.ty)/b.s;
  zs = Math.min(5, Math.max(1, ns));
  ztx = m.x - c.x - zs*qx; zty = m.y - c.y - zs*qy;
  zClamp(); zApply();
}
function openZoom(src, title){
  zimg.src = src; zimg.alt = title || "";
  $("ztitle").textContent = title || "";
  zs = 1; ztx = 0; zty = 0; zPts.clear(); zApply();
  zoomv.hidden = false; document.body.style.overflow = "hidden";
  $("zclose").focus();
}
function closeZoom(){
  zoomv.hidden = true; zimg.removeAttribute("src");
  document.body.style.overflow = $("modal").hidden ? "" : "hidden";
}
$("zclose").onclick = closeZoom;
const zList = () => [...zPts.values()];
const zDist = a => Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);
const zMid = a => ({x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2});
function zBegin(){
  const a = zList();
  if(a.length >= 2) zStart = {d:zDist(a), m:zMid(a), s:zs, tx:ztx, ty:zty};
  else if(a.length === 1) zStart = {p:a[0], tx:ztx, ty:zty};
  else zStart = null;
}
zstage.addEventListener("pointerdown", e=>{
  e.preventDefault();
  try { zstage.setPointerCapture(e.pointerId); } catch(_){}
  if(!zPts.size) zMoved = false;
  zPts.set(e.pointerId, {x:e.clientX, y:e.clientY, t:Date.now(), x0:e.clientX, y0:e.clientY});
  if(zPts.size > 1) zMoved = true;
  zBegin();
});
zstage.addEventListener("pointermove", e=>{
  const p = zPts.get(e.pointerId); if(!p) return;
  p.x = e.clientX; p.y = e.clientY;
  if(Math.hypot(p.x-p.x0, p.y-p.y0) > 8) zMoved = true;
  const a = zList();
  if(a.length >= 2 && zStart && zStart.d){
    zZoomAt(zStart.s * zDist(a)/zStart.d, zMid(a), zStart);
  } else if(a.length === 1 && zStart && zStart.p && zs > 1){
    ztx = zStart.tx + (a[0].x - zStart.p.x); zty = zStart.ty + (a[0].y - zStart.p.y);
    zClamp(); zApply();
  }
});
function zEnd(e){
  const p = zPts.get(e.pointerId); if(!p) return;
  zPts.delete(e.pointerId);
  if(!zPts.size && !zMoved && Date.now() - p.t < 350){
    const now = Date.now();
    if(now - zLastTap < 320){
      zLastTap = 0;
      if(zs > 1){ zs = 1; zClamp(); zApply(); } else zZoomAt(2.5, {x:e.clientX, y:e.clientY});
    } else {
      zLastTap = now;
      const onImg = e.target === zimg || zimg.contains(e.target);
      if(!onImg && zs === 1) setTimeout(()=>{ if(zLastTap === now) closeZoom(); }, 330);
    }
  }
  zBegin();
}

$("btnCopy").onclick = async ()=>{
  const all = state.carts.filter(c=>cartLines(c).length);
  const sides = sidePools().filter(p=>cartLines(p.c).length);
  if(!all.length && !sides.length){ toast("복사할 내역이 없어요"); return; }
  const multi = state.carts.length>1 || sides.length>0;
  const blocks = all.map(c=>{
    const ls = cartLines(c), t = cartTotals(c);
    const body = ls.map(l=>`${l.label} ×${l.q} = ${won(l.sum)}`).join("\n");
    return (multi ? `■ ${c.name} (${won(t.sum)})\n` : "") + body + (EV.combineCarts || !mdGifts().length ? "" : "\n" + `→ 특전: ${giftText(benefits(c).g)}`);
  });
  sides.forEach(p=>{
    const t = cartTotals(p.c);
    blocks.push(`■ ${p.c.name} (${won(t.sum)})\n` + cartLines(p.c).map(l=>`${l.label} ×${l.q} = ${won(l.sum)}`).join("\n") + (p.kind==="cafe" ? `\n→ 증정품: ${cafeGiftText()}` : ""));
  });
  let text = blocks.join("\n\n");
  const g = poolTotals();
  text += `\n\n총 ${g.q}개 / ${won(g.sum)}`;
  if((state.carts.length>1 || EV.combineCarts) && mdGifts().length) text += `\n전체 특전: ${giftText(allGifts().g)}`;
  try { await navigator.clipboard.writeText(text); toast("내역을 복사했어요"); }
  catch(e){
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("내역을 복사했어요"); } catch(_){ toast("복사가 안 돼요. ‘내역 보기’를 캡처해 주세요"); }
    ta.remove();
  }
};

function summaryOf(ev){
  const s = loadState(ev);
  const t = allPools(s).reduce((a,c)=>{const x=cartTotals(c,ev.items);return {q:a.q+x.q,sum:a.sum+x.sum};},{q:0,sum:0});
  return t;
}
function listN(ev){
  const s = loadState(ev);
  return allPools(s).filter(c=>cartTotals(c,ev.items).q>0).length;
}
function totalsOf(ev){
  const s = loadState(ev);
  const r = allPools(s).reduce((a,c)=>{ const t = cartTotals(c,ev.items); return {q:a.q+t.q, sum:a.sum+t.sum}; },{q:0,sum:0});
  r.ld = cartTotals(s.ld,ev.items).sum;
  return r;
}

/* ---- 백업: 모든 행사의 담은 내용을 코드 한 줄로 복사하고, 다른 기기에서 붙여 넣어 불러와요 ---- */
const BK_PREFIX = "GOODSLIST1:";
function backupCode(){
  const data = {};
  try {
    for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(k && k.startsWith("mdcalc-")) data[k] = localStorage.getItem(k); }
  } catch(e){}
  const json = JSON.stringify({v:1, at:new Date().toISOString(), data});
  return BK_PREFIX + btoa(unescape(encodeURIComponent(json)));
}
function readBackup(code){
  const t = String(code||"").replace(/\s+/g,"");
  if(!t.startsWith(BK_PREFIX)) throw new Error("prefix");
  const o = JSON.parse(decodeURIComponent(escape(atob(t.slice(BK_PREFIX.length)))));
  if(!o || o.v!==1 || typeof o.data!=="object") throw new Error("format");
  return o;
}
document.addEventListener("click", e=>{
  if(e.target.id==="btnBackup"){
    const code = backupCode();
    const n = Object.keys(JSON.parse(decodeURIComponent(escape(atob(code.slice(BK_PREFIX.length))))).data).length;
    if(!n){ toast("아직 담은 내용이 없어요"); return; }
    copyText(code, `백업 코드를 복사했어요 (행사 ${n}개)`);
    openModal(`<div class="mhead"><b>백업 코드</b><button type="button" id="mClose">닫기</button></div>
      <p class="mtip">행사 ${n}개의 담은 내용이에요. 메모장이나 나에게 보내기에 붙여 넣어 두고, 다른 기기에서는 ‘백업 불러오기’에 붙여 넣으세요. 자동 복사가 안 됐으면 아래 칸을 길게 눌러 전체 복사해 주세요.</p>
      <textarea class="bktext" id="bkOut" readonly></textarea>`);
    $("bkOut").value = code;
    $("mClose").onclick = closeModal;
  }
  if(e.target.id==="btnRestore"){
    openModal(`<div class="mhead"><b>백업 불러오기</b><button type="button" id="mClose">닫기</button></div>
      <p class="mtip">복사해 둔 백업 코드를 붙여 넣으세요. 코드에 있는 행사는 지금 담긴 내용이 백업 내용으로 바뀌어요.</p>
      <textarea class="bktext" id="bkIn" placeholder="${BK_PREFIX}..."></textarea>
      <div class="mact" style="display:flex;justify-content:flex-end;margin-top:8px"><button type="button" id="bkGo">불러오기</button></div>`);
    $("mClose").onclick = closeModal;
    $("bkGo").onclick = ()=>{
      let o;
      try { o = readBackup($("bkIn").value); } catch(_){ toast("백업 코드가 올바르지 않아요"); return; }
      const keys = Object.keys(o.data).filter(k=>k.startsWith("mdcalc-"));
      if(!keys.length){ toast("백업 코드에 담은 내용이 없어요"); return; }
      const when = new Date(o.at); const ws = isNaN(when) ? "" : ` (${when.getMonth()+1}/${when.getDate()} ${String(when.getHours()).padStart(2,"0")}:${String(when.getMinutes()).padStart(2,"0")} 백업)`;
      if(!confirm(`행사 ${keys.length}개의 담은 내용을 불러올까요?${ws}\n지금 이 기기에 담긴 같은 행사 내용은 덮어써져요.`)) return;
      try { keys.forEach(k=>localStorage.setItem(k, o.data[k])); } catch(_){ toast("저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요"); return; }
      closeModal(); toast("백업을 불러왔어요"); renderHome();
    };
  }
});
let homeQ = "";
const normQ = t => String(t||"").toLowerCase().replace(/[×x·&,()\[\]#<>]/g," ").replace(/\s+/g," ").trim();
const evText = ev => [ev.title, ev.sub, ev.cardSub, ev.subFull, ev.kw, ...ev.items.map(i=>i.name)].filter(Boolean).join(" ");
document.addEventListener("input", e=>{
  if(e.target.id!=="homeQ") return;
  homeQ = e.target.value; $("homeQx").hidden = !homeQ; renderHome();
});
document.addEventListener("click", e=>{
  if(e.target.id!=="homeQx") return;
  homeQ = ""; $("homeQ").value = ""; $("homeQx").hidden = true; renderHome(); $("homeQ").focus();
});
function renderHome(){
  const g = $("evgrid"); g.innerHTML = "";
  const cards = HOME.map(h=>{
    let title, work, sub = "", dates, cover, count, n, sum, ld = 0, target, kw = "";
    if(h.group){
      const G = GROUPS[h.group], evs = G.parts.map(id=>EVENTS.find(e=>e.id===id));
      title = G.title; work = G.work || G.title; sub = G.sub; dates = G.dates; cover = G.cover; target = G.entry;
      kw = [G.kw||"", ...evs.map(evText)].join(" ");
      count = evs.reduce((a,e)=>a+e.items.length,0);
      const tt = evs.map(totalsOf); n = tt.reduce((a,x)=>a+x.q,0); sum = tt.reduce((a,x)=>a+x.sum,0); ld = tt.reduce((a,x)=>a+x.ld,0);
    } else {
      const ev = EVENTS.find(e=>e.id===h.ev);
      title = ev.title; work = ev.work || ev.title; sub = ev.cardSub || ""; dates = ev.dates; cover = ev.cover; target = ev.id;
      kw = evText(ev);
      count = ev.items.length;
      const tt = totalsOf(ev); n = tt.q; sum = tt.sum; ld = tt.ld;
    }
    const pend = (h.group ? GROUPS[h.group].parts.map(id=>EVENTS.find(e=>e.id===id)) : [EVENTS.find(e=>e.id===h.ev)])
      .reduce((a,e)=>a+loadState(e).carts.reduce((x,c)=>x+rsvCount(c,e.items),0),0);
    const st = evStatus(dates), r = dateRange(dates) || {start:0,end:0};
    return {title,work,sub,dates,cover,count,n,sum,ld,pend,target,kw:normQ([work,title,sub,dates,kw].join(" ")),status:st,start:r.start,end:r.end,ended:st==="ended"};
  });
  // 운영 중(오픈일 빠른 순) → 운영 예정(오픈일 빠른 순) → 운영 종료(최근에 끝난 순, 먼저 끝난 행사가 맨 뒤)
  const rank = {live:0, soon:1, ended:2};
  cards.forEach((c,i)=>c.i=i);
  cards.sort((x,y)=> rank[x.status]-rank[y.status] || (x.status==="ended" ? y.end-x.end : x.start-y.start) || x.i-y.i);
  const q = normQ(homeQ), qc = q.replace(/ /g,"");
  const hit = c => !q || q.split(" ").every(w=>c.kw.includes(w)) || c.kw.replace(/ /g,"").includes(qc);
  const found = cards.filter(hit);
  const cnt = {all:found.length, live:0, soon:0, ended:0}; found.forEach(c=>cnt[c.status]++);
  const labels = {all:"전체", live:"운영 중", soon:"운영 예정", ended:"운영 종료"};
  document.querySelectorAll("#homeTabs button").forEach(b=>{
    const k = b.dataset.s; b.setAttribute("aria-pressed", String(k===homeTab));
    b.innerHTML = `${labels[k]} <b>${cnt[k]}</b>`;
  });
  const shown = found.filter(c=>homeTab==="all" || c.status===homeTab);
  if(!shown.length) g.innerHTML = q ? `<p class="homeempty">‘${esc(homeQ.trim())}’에 맞는 ${homeTab==="all" ? "" : labels[homeTab] + " "}행사가 없어요.</p>` : `<p class="homeempty">${labels[homeTab]}인 행사가 없어요.</p>`;
  shown.forEach(c=>{
    const b = document.createElement("div");
    b.setAttribute("role","button"); b.tabIndex = 0; b.className = "evcard" + (c.ended ? " ended" : "");
    b.onkeydown = e=>{ if(e.key==="Enter" || e.key===" "){ e.preventDefault(); go(c.target); } };
    b.innerHTML = `<div class="evcover"><img loading="lazy" src="${c.cover}" alt="${esc(c.title)} 대표 이미지">${c.ended ? `<div class="endmask"><span>END</span></div>` : ""}</div>
      <div class="evinfo"><div class="evwork">${esc(c.work).replace(/\n/g,"<br>")}</div>${c.work!==c.title ? `<div class="evname">${esc(c.title)}</div>` : ""}
      ${c.sub ? `<div class="evdate">${esc(c.sub)}</div>` : ""}
      ${c.dates ? `<div class="evdate">${esc(c.dates)}</div>` : ""}
      <div class="evmeta"><span>${c.count}종</span><span>내 리스트 <b>${c.n}개</b></span></div>
      <div class="evsums">${c.ld ? `<div class="evsum${c.sum-c.ld?" on":""}">담은 금액 <b>${won(c.sum-c.ld)}</b></div><div class="evsum on">럭키드로우 <b>${won(c.ld)}</b></div>` : `<div class="evsum${c.sum?" on":""}">담은 금액 <b>${won(c.sum)}</b></div>`}</div>${c.pend ? `<span class="evpick">예약 구매 ${c.pend}개</span>` : ""}</div>`;
    b.onclick = ()=>go(c.target);
    g.appendChild(b);
  });
}

function showHome(){
  $("eventWrap").hidden = true; $("bar").hidden = true; $("homeWrap").hidden = false;
  document.body.classList.add("home");
  document.title = "GOODS LIST";
  renderHome(); window.scrollTo(0,0);
}
function openEvent(id){
  EV = EVENTS.find(e=>e.id===id); ITEMS = EV.items; state = loadState(EV);
  if(!EV.hasLd && state.active==="ld") state.active = state.carts[0].id;
  filter = "all"; catFilter = "all"; delArmed = false;
  document.querySelectorAll("#filterRow button").forEach(x=>x.setAttribute("aria-pressed", x.dataset.f==="all"));
  $("evTitle").innerHTML = esc(EV.title) + (isEnded(EV.dates) ? `<span class="endpill">END</span>` : "");
  $("evSub").textContent = EV.subFull || (EV.sub + " 굿즈 계산기");
  const pl = $("evPlace"); pl.textContent = EV.place ? "장소 · " + EV.place : ""; pl.hidden = !EV.place;
  const ps = $("parts");
  if(EV.group){
    ps.hidden = false; ps.innerHTML = "";
    GROUPS[EV.group].parts.forEach(pid=>{
      const pe = EVENTS.find(e=>e.id===pid);
      const b = document.createElement("button");
      b.type = "button"; b.textContent = pe.sub; b.setAttribute("aria-pressed", pid===EV.id);
      b.onclick = ()=>go(pid);
      ps.appendChild(b);
    });
  } else { ps.hidden = true; ps.innerHTML = ""; }
  document.title = EV.title + " · GOODS LIST";
  $("homeWrap").hidden = true; $("eventWrap").hidden = false; $("bar").hidden = false;
  document.body.classList.remove("home");
  render(); window.scrollTo(0,0);
}
function route(){
  let id = null;
  try { const m = location.hash.match(/^#\/e\/([\w-]+)/); if(m) id = m[1]; } catch(e){}
  if(id && GROUPS[id]) id = GROUPS[id].entry;
  if(id && EVENTS.some(e=>e.id===id)){ if(!EV || EV.id!==id || $("eventWrap").hidden) openEvent(id); }
  else showHome();
}
function go(id){
  try { location.hash = id ? "#/e/"+id : "#/"; } catch(e){}
  route();
}
window.addEventListener("hashchange", route);
route();
